name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" && test -d "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run device policy unit tests
        run: set -o pipefail; gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest 2>&1 | tee unit-test.log
        shell: bash
      - name: Build debug APK
        run: set -o pipefail; gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee build.log
        shell: bash
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            build.log
            unit-test.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aimanage-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
