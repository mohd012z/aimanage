name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: set -o pipefail; gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee build.log
        shell: bash
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aimanage-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
