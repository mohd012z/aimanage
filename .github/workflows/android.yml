name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" && test -d "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run device policy unit tests
        run: set -o pipefail; gradle --no-daemon --stacktrace --console=plain :app:testStandardDebugUnitTest :app:testAdvancedDebugUnitTest 2>&1 | tee unit-test.log
        shell: bash
      - name: Run Android lint
        run: set -o pipefail; gradle --no-daemon --stacktrace --console=plain :app:lintStandardDebug :app:lintAdvancedDebug 2>&1 | tee lint.log
        shell: bash
      - name: Build debug APK
        run: set -o pipefail; gradle --no-daemon --stacktrace --console=plain :app:assembleStandardDebug :app:assembleAdvancedDebug 2>&1 | tee build.log
        shell: bash
      - name: Audit compiled APK permissions (fail closed)
        run: |
          python3 scripts/check_apk_permissions.py
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            build.log
            unit-test.log
            lint.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aimanage-standard-and-advanced-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 7
